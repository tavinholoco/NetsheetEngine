# NETSHEET ENGINE — Netlify (frontend estático) — Fase 10, T10.2
# Build: só o cliente Vite (o backend fica no Railway/Render/Fly.io).
# O SPA profundo (/room/ABC123) redireciona para o index.html (deep-link T7.4).

[build]
  command = "npm run build:web"
  publish = "dist"

# SPA catch-all: arquivos estáticos existentes são servidos primeiro;
# o redirect só pega rotas que não correspondem a um arquivo real.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
