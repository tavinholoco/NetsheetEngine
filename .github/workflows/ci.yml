name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # O job de segredos também roda em qualquer branch (push + PR), para
  # bloquear chaves ANTES de chegarem ao master — ver job secrets-scan.

# T10.5 — um único pipeline em andamento por ref; push em sequência cancela a
# execução anterior (economiza minutos e evita corridas em estado obsoleto).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # para registrar achados na aba Security (SARIF)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versão sincronizada com o campo [version] ref de .gitleaks.toml
      - name: Instalar gitleaks (pinado)
        run: |
          GITLEAKS_VERSION="v8.23.3"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')"
          FILE="gitleaks_${GITLEAKS_VERSION#v}_${OS}_${ARCH}.tar.gz"
          curl -sfL "https://github.com/zricethezav/gitleaks/releases/download/${GITLEAKS_VERSION}/${FILE}" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detectar segredos no código
        run: |
          # 1ª passada: falha o pipeline se encontrar segredos
          gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

      - name: Gerar relatório SARIF (aba Security)
        if: always()
        run: |
          # exit 0 mesmo com leaks — o fail do pipeline vem da passada acima
          gitleaks detect --source . --config .gitleaks.toml --redact --report-path gitleaks.sarif --report-format sarif || true

      - name: Registrar achados na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Falhar se segredos forem encontrados
        if: failure()
        run: |
          echo "❌ Segredo(s) detectado(s) — corrija e reenvie o commit."
          exit 1

  validate:
    name: tsc + build + testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build (Vite + bundle do servidor)
        run: npm run build

      - name: Testes (unit + integração — Vitest, T9.1+)
        run: npm run test

      - name: Smoke test do servidor de produção
        run: |
          NODE_ENV=production PORT=3000 node dist/server.cjs > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
          if [ "$HEALTH" != "200" ]; then
            echo "❌ Healthcheck falhou (HTTP $HEALTH)"
            tail -20 /tmp/server.log
            exit 1
          fi
          echo "✅ Healthcheck OK (HTTP $HEALTH)"
          # E2E WebSocket (T5.4) — valida o discriminador isBinary (texto vs
          # binário Yjs) + anti-forjamento de rollResult. Sem SUPABASE_URL o
          # servidor roda sem persistência — o teste usa só memória (cria sala).
          node scripts/test-ws-e2e.mjs
          E2E_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          if [ "$E2E_EXIT" != "0" ]; then
            echo "❌ E2E WebSocket falhou (exit $E2E_EXIT)"
            tail -20 /tmp/server.log
            exit 1
          fi
          echo "✅ E2E WebSocket OK"

  e2e:
    name: E2E Playwright (auth, ficha, multiplayer 2 navegadores)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (Vite + bundle do servidor)
        run: npm run build

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      # T9.4 — o webServer do playwright.config.ts sobe o servidor de produção
      # (dist/server.cjs, NODE_ENV=production) e os 6 testes E2E rodam contra ele.
      - name: Rodar E2E (auth → ficha → multiplayer 2 navegadores)
        run: npm run test:e2e

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db-sync:
    # T10.8 — aplica migrations Supabase (0001–0006) no banco linked quando
    # houver mudanças. INERTE até o usuário configurar os secrets do repo:
    # SUPABASE_ACCESS_TOKEN (personal access token) + SUPABASE_PROJECT_REF
    # (project-ref do projeto cloud). Sem eles, o job pula com exit 0.
    name: Migrations Supabase (db push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: validate
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations no banco linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ℹ️  Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF ausentes —"
            echo "   etapa de db push pulada. Configure-os no repo para ativar (docs/PRODUCTION_CHECKLIST.md §6)."
            exit 0
          fi
          # O plano gratuito do Supabase pausa o projeto com ~7 dias de baixa
          # atividade no banco. Projeto pausado NÃO é falha de build: nada foi
          # quebrado, e as migrations entram no próximo push depois de acordar.
          # Sem esta tolerância, todo push no master vira vermelho enquanto o
          # projeto dorme — foi o que aconteceu entre 02/09 e 03/09/2026.
          # O keepalive.yml existe para que esse caso seja raro.
          set +e
          out=$(supabase link --project-ref "$SUPABASE_PROJECT_REF" 2>&1 \
                && supabase db push --yes 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -qi "project is paused"; then
              echo "::warning::Projeto Supabase pausado — migrations adiadas para o próximo push. Restaure em https://supabase.com/dashboard"
              exit 0
            fi
            exit $status
          fi
